# Solo el bot. El reverse proxy y los certificados viven en infra/, porque son
# compartidos con el resto de proyectos del servidor.
#
# Este contenedor NO publica ningún puerto: solo es accesible desde la red `web`,
# es decir, a través de Caddy. Así nadie puede saltarse el TLS llegando al 8000.
#
# Requisito previo (una sola vez en el servidor):  docker network create web
# Arranque:  docker compose up -d --build

name: insta-response

services:
  bot:
    build: .
    # Tag explícito y propio. Nunca reutilizar un nombre de imagen existente:
    # `docker build -t` sobre un tag ajeno lo sobrescribe sin avisar.
    image: insta-response-bot:local
    # Caddy enruta hacia este nombre; si lo cambias, actualiza infra/Caddyfile.
    container_name: insta-response-bot
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    networks:
      - web
    healthcheck:
      # La imagen slim no trae curl; se usa el propio Python.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      # Sin esto los logs crecen sin límite y acaban llenando el disco de la VM.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  web:
    external: true
    name: web
