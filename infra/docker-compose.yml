# Infraestructura compartida del servidor: el reverse proxy.
#
# Esto NO es parte del bot. Es la puerta de entrada de TODOS los proyectos que
# alojes en esta máquina. Solo este compose publica los puertos 80 y 443; los
# demás proyectos no publican ninguno y quedan accesibles únicamente a través
# de Caddy, por la red interna `web`.
#
# Antes del primer arranque, crea esa red una sola vez:
#     docker network create web
#
# Arranque:  docker compose up -d

name: infra

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"     # necesario para el desafío HTTP de Let's Encrypt
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados: sin esto se repiden en cada reinicio
      - caddy_config:/config
      # Sitios estáticos: cada carpeta de /srv es una web. Montado de una vez
      # para que añadir un sitio HTML no requiera tocar este archivo nunca más;
      # basta con crear la carpeta y añadir su bloque al Caddyfile.
      # Solo lectura: Caddy sirve, no escribe.
      - /srv:/srv:ro
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Red compartida entre proyectos. "external" significa que compose no la crea
  # ni la borra: la gestionas tú con `docker network create web`. Así ningún
  # `docker compose down` de un proyecto se lleva por delante la red de los demás.
  web:
    external: true
    name: web

volumes:
  caddy_data:
  caddy_config:
